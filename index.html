<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Name</title>
  </head>
  <body>
    <div id="app">
      <h1>Shop Name</h1>
      <!-- Order details -->
      <div class="rectangle-container">
        <div class="rectangle">
          <h2><strong>Total Revenue</strong></h2>
          <h3>$0.00</h3>
        </div>
        <div class="rectangle">
          <h2>Total Orders</h2>
          <h3>0</h3>
        </div>
        <div class="rectangle"></div>
      </div>
      <!-- Orders JSON/CSV file input -->
      <div id="dropzone">
        <label for="fileinput">Choose or drop a file:</label>

        <button id="selectFileBtn">Browse Files</button>
        <input
          type="file"
          id="fileinput"
          accept=".csv, .json"
          style="display: none"
        />
      </div>

      <!-- Orders UI display area  -->
      <div id="order-list"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
